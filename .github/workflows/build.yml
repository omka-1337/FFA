# The engine built and tested on every push: the library, ffa-script and
# ffa-play (SDL2 and OpenGL ES 2), the VM's tests against the packages
# tests/fixtures.py writes, and the Python tools compiled. ffa-play and
# ffa-script are kept as an artifact. No game data is needed or used.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev libgles-dev python3

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Python tools
        run: python3 -m py_compile ffa tools/*.py tests/fixtures.py

      - uses: actions/upload-artifact@v5
        with:
          name: ffa-linux-x86_64
          path: |
            build/ffa-play
            build/ffa-script
          if-no-files-found: error

  # The aarch64 build for the handhelds: in PortMaster's own build container
  # (Ubuntu 20.04, glibc 2.31, old enough for them) with gcc 10 for C++20, the
  # C++ runtime linked in; SDL2 and GLES come from the device. The port itself,
  # its launcher and packaging, is kept apart from the engine.
  aarch64:
    runs-on: ubuntu-24.04-arm
    container: monkeyx/retro_builder:arm64
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          rm -f /etc/apt/sources.list.d/kitware*
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends g++-10 gcc-10 ninja-build libsdl2-dev libgles2-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-10 -DCMAKE_CXX_COMPILER=g++-10 -DFFA_STATIC_RUNTIME=ON

      - name: Build
        run: |
          cmake --build build --target ffa-play
          strip build/ffa-play
          objdump -T build/ffa-play | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v5
        with:
          name: ffa-linux-aarch64
          path: build/ffa-play
          if-no-files-found: error
